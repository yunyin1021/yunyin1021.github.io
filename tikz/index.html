<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'"><meta name="color-scheme" content="light"><meta name="description" content="在浏览器本地运行的 TikZ 绘图与交换图编辑器，无需 Python、TeX 或编译服务器。"><title>TikZ Studio · 雲隐</title><link rel="stylesheet" href="style.css?v=0.1.0"><script src="mathjax-config.js"></script><script defer src="vendor/mathjax/es5/tex-svg.js"></script><script defer src="core.js?v=0.1.0"></script><script defer src="app.js?v=0.1.0"></script></head>
<body><div id="app"><header class="top"><div class="brand">TikZ <span>Studio</span><small>WEB · 0.1</small></div><div class="file-group"><button id="fileBtn" data-i18n="文件">文件</button><button id="undoBtn" class="icon" title="撤销 / Undo">↶</button><button id="redoBtn" class="icon" title="重做 / Redo">↷</button></div><div class="canvas-top"><button id="sizeBtn" data-i18n="画布大小">画布大小</button><button id="backgroundBtn" data-i18n="画布背景">画布背景</button><button id="transformBtn" data-i18n="画布变换">画布变换</button></div><div class="right-top"><span class="local-badge" data-i18n="本地运行">本地运行</span><button id="settingsBtn" title="设置 / Settings">⚙</button><button id="aboutBtn" title="说明与作者 / About">ⓘ</button></div></header>
<main><section class="workspace"><nav id="tools" class="tools" aria-label="绘图工具"></nav><div id="stage" class="stage"><svg id="drawing" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="img" aria-label="绘图画布"></svg><div class="stage-note" id="stageNote"></div><div class="loading" id="loading">正在加载本地数学排版…</div></div><footer class="viewbar"><button id="handBtn" class="icon" title="浏览模式 / Pan">✋</button><label><input id="grid" type="checkbox" checked><span data-i18n="方格">方格</span></label><label><input id="checker" type="checkbox" checked><span data-i18n="棋盘">棋盘</span></label><label><input id="snapGrid" type="checkbox"><span data-i18n="网格吸附">网格吸附</span></label><label><input id="snapAlign" type="checkbox" checked><span data-i18n="对齐">对齐</span></label><label><input id="snapEnd" type="checkbox" checked><span data-i18n="端点">端点</span></label><div class="zoom"><button id="zoomOut" aria-label="缩小">−</button><input id="zoom" type="range" min="15" max="600" value="100" aria-label="缩放"><button id="zoomIn" aria-label="放大">+</button><span id="zoomValue">100%</span><button id="fitBtn" data-i18n="适应画布">适应画布</button></div></footer></section>
<aside><section id="inspector" class="inspector"><div class="section-head"><span data-i18n="对象属性">对象属性</span><span id="selectionCount"></span></div><div id="props"></div></section><section class="code-panel"><div class="section-head"><span>TikZ</span><div><button id="applyCode" data-i18n="应用代码">应用代码</button><button id="restoreCode" title="恢复图形生成的代码">↺</button></div></div><div id="codeWrap" class="code-wrap"><div id="gutter" class="gutter" aria-hidden="true"></div><textarea id="code" wrap="soft" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="TikZ 代码"></textarea></div><div class="code-actions"><button id="copyCode" data-i18n="复制代码">复制代码</button><button id="exportBtn" data-i18n="导出">导出</button><span id="codeState"></span></div></section><section class="report"><div class="section-head"><span data-i18n="运行状态">运行状态</span><span id="saveState"></span></div><p id="status" role="status"></p><div class="report-bottom"><span id="docInfo"></span><button id="helpBtn" data-i18n="网页版限制">网页版限制</button></div></section></aside></main><input id="fileInput" type="file" accept=".json,.tex,.tikz" hidden><div id="menu" class="menu" hidden></div><div id="toast" class="toast" role="status" hidden></div><div id="modal" class="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">×</button></header><div id="modalBody"></div><footer id="modalFooter"></footer></div></div></div><noscript>此编辑器需要浏览器启用 JavaScript。所有绘图计算均在本地进行。</noscript></body></html>
